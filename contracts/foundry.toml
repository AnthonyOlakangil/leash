# Dependencies (contracts/lib is gitignored; reinstall with forge install ... --no-git):
#   OpenZeppelin/openzeppelin-contracts v5.7.0
#   vectorized/solady v0.1.26 (MockAUSD only)
#   foundry-rs/forge-std (latest at install, 2026-10-11)
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "../packages/abi" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "solady/=lib/solady/src/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
